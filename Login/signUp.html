<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container-login">
        <div class="curved-shape"></div>
        <div class="curved-shape2"></div>

        <!-- Login Form -->
        <div class="form-box Login">
            <h2 class="animation" style="--D:0; --S:21">Login</h2>
            <form action="#">
                <div class="input-box animation" style="--D:1; --S:22">
                    <input type="text" id="login-username" required>
                    <label for="">Username</label>
                    <box-icon type='solid' name='user'></box-icon>
                </div>

                <div class="input-box animation" style="--D:2; --S:23">
                    <input type="password" id="login-password" required>
                    <label for="">Password</label>
                    <box-icon name='lock-alt' type='solid'></box-icon>
                </div>

                <div class="input-box animation" style="--D:3; --S:24">
                    <button class="btn" type="submit">Login</button>
                </div>

                <div class="regi-link animation" style="--D:4; --S:25">
                    <p>Don't have an account? <br> <a href="#" class="SignUpLink">Sign Up</a></p>
                </div>
            </form>
        </div>

        <!-- Login Info Content -->
        <div class="info-content Login">
            <h2 class="animation" style="--D:0; --S:20">WELCOME BACK!</h2>
            <p class="animation" style="--D:1; --S:21">Discover Your Next Blockbuster - Stream, Watch, and Enjoy the
                Best in Cinema!</p>
        </div>

        <!-- Registration Form -->
        <div class="form-box Register">
            <h2 class="animation" style="--li:17; --S:0">Register</h2>
            <form id="register-form"> <!-- Added id for the form -->
                <div class="input-box animation" style="--li:18; --S:1">
                    <input type="text" id="register-username" name="username" placeholder="Enter your username">
 <!-- Added id -->
                    <label for="">Username</label>
                    <box-icon type='solid' name='user'></box-icon>
                </div>

                <div class="input-box animation" style="--li:19; --S:2">
                    <input type="email" id="register-email" required> <!-- Added id -->
                    <label for="">Email</label>
                    <box-icon name='envelope' type='solid'></box-icon>
                </div>

                <div class="input-box animation" style="--li:20; --S:3">
                    <input type="password" id="register-password" required> <!-- Added id -->
                    <label for="">Password</label>
                    <box-icon name='lock-alt' type='solid'></box-icon>
                </div>

                <div class="input-box animation" style="--li:21; --S:4">
                    <!-- Changed button to submit and added an onclick event -->
                    <button class="btn" type="submit" onclick="downloadUserDetails()">Register</button>
                </div>

                <div class="regi-link animation" style="--li:22; --S:5">
                    <p>Already have an account? <br> <a href="#" class="SignInLink">Sign In</a></p>
                </div>
            </form>
        </div>

        <!-- Registration Info Content -->
        <div class="info-content Register">
            <h2 class="animation" style="--li:17; --S:0">WELCOME!</h2>
            <p class="animation" style="--li:18; --S:1">We’re delighted to have you here. If you need any assistance,
                feel free to reach out.</p>
        </div>
    </div>

    <!-- Link to your JavaScript file -->
    <!-- <script src="script.js"></script> -->
    <script src="signup-script.js"></script>
    <!-- Boxicons script -->
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
</body>

</html>
